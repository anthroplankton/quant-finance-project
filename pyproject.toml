[project]
name = "quant-finance-project"
version = "0.1.0"
description = "Quantitative Finance course project: Taiwan Hype Index replication using news-attention and TEJ-based top-50 market data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
notebook = [
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
]
report = [
    "matplotlib>=3.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
